version: 2

sources:
  - name: raw
    description: "Lớp dữ liệu thô (Raw Parquet Files) nằm trong data/raw"
    tables:
      - name: universe
        description: "Danh sách hiện tại của Nasdaq-100"
        meta:
          # Chỉ đích danh file universe
          external_location: "../data/raw/universe/universe.parquet"

      - name: edgar
        description: "Dữ liệu Báo cáo tài chính (SEC)"
        meta:
          # DuckDB hỗ trợ Glob Pattern: Đọc gộp TẤT CẢ các file edgar_*.parquet cùng lúc!
          external_location: "../data/raw/edgar/edgar_*.parquet"

      - name: prices
        description: "Dữ liệu lịch sử Giá (Yahoo)"
        meta:
          external_location: "../data/raw/prices/price_*.parquet"

      - name: sector
        description: "Sector/industry hiện tại của từng mã (Yahoo), ảnh chụp 1 file duy nhất"
        meta:
          external_location: "../data/raw/sector/sector.parquet"