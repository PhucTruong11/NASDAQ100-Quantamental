# docker-compose.yml — Airflow LocalExecutor (Section 14)

#   - Điền image version Airflow
#   - Mount volume warehouse.duckdb và data/raw/
#   - Cấu hình LocalExecutor

version: "3.8"

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: "quant_airflow_secret_key_12345"
  PYTHONPATH: "/opt/airflow"
  DBT_PARTIAL_PARSE: "false"
  _PIP_ADDITIONAL_REQUIREMENTS: "duckdb==1.5.5 dbt-core==1.12.6 dbt-duckdb==1.11.0 polars==2.0.0 yfinance==1.7.0"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./data/.cache/pip:/home/airflow/.cache/pip
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      # UI reads serialized DAGs/metadata; it does not execute data jobs.
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow pools set duckdb_access 1 'Serialize DuckDB warehouse access'"]
    environment:
      <<: *airflow-env
      # Migration/user setup only needs the Airflow image's original packages.
      _PIP_ADDITIONAL_REQUIREMENTS: ""
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
